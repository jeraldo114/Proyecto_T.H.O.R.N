name: CI

on:
  push:
  pull_request:

# Las pruebas no necesitan escribir en el repositorio ni recibir claves reales.
permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test HUD
        working-directory: frontend
        run: |
          npm ci --no-fund
          npm test
          npm run build
      - name: Install browser for HUD checks
        if: runner.os == 'Linux'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Check HUD with real local sensor
        if: runner.os == 'Linux'
        working-directory: frontend
        env:
          THORN_TEST_START_SERVER: '1'
          THORN_TEST_URL: http://127.0.0.1:8009
          THORN_PYTHON: python
        run: |
          npm run test:e2e
          npm run test:ocr
      - name: Check committed files and history
        run: python tools/check_repository.py --history
      - name: Unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Django check
        run: python manage.py check

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install audit tools
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Check known vulnerabilities
        run: python -m pip_audit --strict --disable-pip -r requirements.txt
      - name: Check optional desktop dependencies
        run: python -m pip_audit --strict --disable-pip -r requirements-desktop.txt
      - name: Check optional local speech dependencies
        run: python -m pip_audit --strict --disable-pip -r requirements-speech.txt
      - name: Check optional local voice dependencies
        run: python -m pip_audit --strict --disable-pip -r requirements-voice.txt
      - name: Check build tool dependencies
        run: python -m pip_audit --strict --disable-pip -r requirements-build.txt
